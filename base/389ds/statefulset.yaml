apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: 389ds
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    # Restart 389ds when cert-manager renews its server certificate. 389ds
    # reads its certificate only at startup.
    secret.reloader.stakater.com/reload: "389ds-tls"
spec:
  replicas: 1
  volumeClaimTemplates:
    - apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: ldapdata
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
  template:
    spec:
      terminationGracePeriodSeconds: 5
      containers:
        - name: 389ds
          image: 389ds
          envFrom:
            - secretRef:
                name: 389ds-credentials
          ports:
            - containerPort: 3389
              name: ldap
              hostPort: 3389
            - containerPort: 3636
              name: ldaps
              hostPort: 3636
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "1Gi"
              cpu: "500m"
          volumeMounts:
            - name: ldapdata
              mountPath: /data
            - name: ldap-tls
              mountPath: /data/tls
              readOnly: true
            - name: custom-schema
              mountPath: /etc/dirsrv/schema/98wireguard.ldif
              subPath: 98wireguard.ldif
              readOnly: true
      volumes:
        - name: ldap-tls
          secret:
            secretName: 389ds-tls
            items:
              - key: tls.crt
                path: server.crt
              - key: tls.key
                path: server.key
              - key: ca.crt
                path: ca/ca.crt
        - name: custom-schema
          configMap:
            name: 389ds-custom-schema
