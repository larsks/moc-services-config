apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: 389ds
  annotations:
    argocd.argoproj.io/sync-wave: "3"
    # Restart 389ds when cert-manager renews its server certificate. 389ds
    # reads its certificate only at startup.
    secret.reloader.stakater.com/reload: "389ds-tls"
spec:
  replicas: 1
  volumeClaimTemplates:
    - apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: ldapdata
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi
  template:
    spec:
      terminationGracePeriodSeconds: 5
      containers:
        - name: 389ds
          image: 389ds
          command: ["sh", "/init/init.sh"]
          envFrom:
            - secretRef:
                name: 389ds-credentials
          env:
            # Local ldapi socket. Probes reference this with $(LDAPI_SOCKET), so
            # the value must be URL-encoded as ldapi:// requires.
            - name: LDAPI_SOCKET
              value: "ldapi://%2Fdata%2Frun%2Fslapd-localhost.socket"
          ports:
            - containerPort: 3389
              name: ldap
            - containerPort: 3636
              name: ldaps
          # The startup probe holds off liveness and readiness until the server
          # first answers over the local ldapi socket. The init script allows
          # up to 60 seconds for this, so the probe allows the same.
          startupProbe:
            exec:
              command: ["ldapsearch", "-Y", "EXTERNAL", "-H", "$(LDAPI_SOCKET)", "-b", "", "-s", "base"]
            periodSeconds: 2
            failureThreshold: 60
          # Readiness checks the TCP listener that clients use, since the ldapi
          # socket does not prove that port 3389 is accepting connections.
          readinessProbe:
            exec:
              command: ["ldapsearch", "-H", "ldap://localhost:3389", "-x", "-b", "", "-s", "base"]
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command: ["ldapsearch", "-Y", "EXTERNAL", "-H", "$(LDAPI_SOCKET)", "-b", "", "-s", "base"]
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "1Gi"
              cpu: "500m"
          volumeMounts:
            - name: ldapdata
              mountPath: /data
            - name: ldap-tls
              mountPath: /data/tls
              readOnly: true
            - name: custom-schema
              mountPath: /etc/dirsrv/schema/98wireguard.ldif
              subPath: 98wireguard.ldif
              readOnly: true
            - name: init-script
              mountPath: /init
              readOnly: true
            - name: init-ldif
              mountPath: /ldif-init
              readOnly: true
      volumes:
        - name: ldap-tls
          secret:
            secretName: 389ds-tls
            items:
              - key: tls.crt
                path: server.crt
              - key: tls.key
                path: server.key
              - key: ca.crt
                path: ca/ca.crt
        - name: custom-schema
          configMap:
            name: 389ds-custom-schema
        - name: init-script
          configMap:
            name: 389ds-init-script
        - name: init-ldif
          configMap:
            name: 389ds-init-ldif
