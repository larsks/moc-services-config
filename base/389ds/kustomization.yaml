apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: 389ds

labels:
  - pairs:
      component: 389ds
    includeSelectors: true

resources:
  - namespace.yaml
  - statefulset.yaml
  - service.yaml
  - config

configMapGenerator:
  - name: 389ds-custom-schema
    files:
      - schema/98wireguard.ldif
  - name: 389ds-envoy-config
    files:
      - envoy/envoy.yaml
  - name: 389ds-envoy-entrypoint
    files:
      - envoy/entrypoint.sh

images:
  - name: 389ds
    newName: docker.io/389ds/dirsrv
    newTag: latest
  - name: envoy
    newName: docker.io/envoyproxy/envoy
    newTag: v1.34.0
