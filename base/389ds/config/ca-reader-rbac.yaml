apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: keycloak-389ds-ca-reader
rules:
  - apiGroups: [""]
    resources:
      - secrets
    verbs:
      - get
      - list
      - watch
  - apiGroups:
      - authorization.k8s.io
    resources:
      - selfsubjectrulesreviews
    verbs:
      - create
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: keycloak-389ds-ca-reader
subjects:
  - kind: ServiceAccount
    name: keycloak-389ds-ca-reader
    namespace: keycloak
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: keycloak-389ds-ca-reader
