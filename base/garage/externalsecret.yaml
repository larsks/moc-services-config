apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: garage-credentials
  namespace: garage
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  # Fetch and create the secret once; a generator-backed ExternalSecret
  # would otherwise mint new random credentials on every refresh.
  refreshInterval: 0s
  target:
    name: garage-credentials
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: garage-rpc-secret
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: garage-admin-token
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: Password
          name: garage-default-secret-key
