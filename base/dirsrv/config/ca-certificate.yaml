apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: dirsrv-ca
spec:
  isCA: true
  commonName: dirsrv internal CA
  secretName: dirsrv-ca
  duration: 87600h
  privateKey:
    algorithm: RSA
    rotationPolicy: Never
    size: 3072
  issuerRef:
    name: selfsigned
    kind: ClusterIssuer
  usages:
    - cert sign
    - crl sign
