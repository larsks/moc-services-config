apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: dirsrv
commonAnnotations:
  # These resources must be applied with the StatefulSet: its pod cannot be
  # healthy until cert-manager has created the mounted TLS Secret.
  argocd.argoproj.io/sync-wave: "1"
  argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true

resources:
  - ca-certificate.yaml
  - ca-issuer.yaml
  - server-certificate.yaml
  - ca-reader-rbac.yaml
