apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: dirsrv-server
spec:
  secretName: dirsrv-tls
  commonName: dirsrv.dirsrv.svc.cluster.local
  duration: 2160h
  renewBefore: 360h
  privateKey:
    algorithm: RSA
    size: 2048
  issuerRef:
    name: dirsrv-ca
    kind: Issuer
  dnsNames:
    - dirsrv
    - dirsrv.dirsrv
    - dirsrv.dirsrv.svc
    - dirsrv.dirsrv.svc.cluster.local
  usages:
    - server auth
