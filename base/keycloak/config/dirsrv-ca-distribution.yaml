apiVersion: v1
kind: ServiceAccount
metadata:
  name: keycloak-dirsrv-ca-reader
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: dirsrv-ca-store
spec:
  provider:
    kubernetes:
      remoteNamespace: dirsrv
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
      auth:
        serviceAccount:
          name: keycloak-dirsrv-ca-reader
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: dirsrv-ca-trust
spec:
  refreshInterval: 10m
  secretStoreRef:
    name: dirsrv-ca-store
    kind: SecretStore
  target:
    name: dirsrv-ca-trust
    creationPolicy: Owner
    template:
      type: Opaque
  data:
    - secretKey: ca.crt
      remoteRef:
        key: dirsrv-ca
        property: tls.crt
