apiVersion: v1
kind: ServiceAccount
metadata:
  name: keycloak-389ds-ca-reader
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: 389ds-ca-store
spec:
  provider:
    kubernetes:
      remoteNamespace: 389ds
      server:
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
      auth:
        serviceAccount:
          name: keycloak-389ds-ca-reader
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: 389ds-ca-trust
spec:
  refreshInterval: 10m
  secretStoreRef:
    name: 389ds-ca-store
    kind: SecretStore
  target:
    name: 389ds-ca-trust
    creationPolicy: Owner
    template:
      type: Opaque
  data:
    - secretKey: ca.crt
      remoteRef:
        key: 389ds-ca
        property: tls.crt
