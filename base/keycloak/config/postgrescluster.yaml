apiVersion: postgres-operator.crunchydata.com/v1beta1
kind: PostgresCluster
metadata:
  name: postgres
  labels:
    component: postgres
  annotations:
    postgres-operator.crunchydata.com/autoCreateUserSchema: "true"
    argocd.argoproj.io/sync-wave: "1"
spec:
  users:
    - name: keycloak
      databases:
        - keycloak
    - name: lldap
      databases:
        - lldap
  instances:
    - replicas: 1
      name: "postgres"
      dataVolumeClaimSpec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 20Gi
            cpu: "200m"
            memory: "200Mi"
          limits:
            cpu: "1"
            memory: "1Gi"
      walVolumeClaimSpec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 20Gi
            cpu: "200m"
            memory: "200Mi"
          limits:
            cpu: "1"
            memory: "512Mi"
      resources:
        requests:
          cpu: "200m"
          memory: "200Mi"
        limits:
          cpu: "1"
          memory: "1Gi"
  image: registry.developers.crunchydata.com/crunchydata/crunchy-postgres:ubi9-18.6-2633
  postgresVersion: 18
  patroni:
    dynamicConfiguration:
      postgresql:
        parameters:
          log_connections: "on"
          log_disconnections: "on"
          logging_collector: "off"
        pg_hba:
          - "host all all 0.0.0.0/0 md5"
          - "host all all ::/0 md5"
          - "local all all trust"
