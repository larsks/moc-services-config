apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component

patches:
  - patch: |
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: argocd-cm
      data:
        resource.customizations.health.postgres-operator.crunchydata.com_PostgresCluster: |
          hs = {}
          if obj.status ~= nil then
            if obj.status.instances ~= nil then
              for i, instance in ipairs(obj.status.instances) do
                if instance.readyReplicas ~= instance.replicas then
                  hs.status = "Progressing"
                  hs.message = "Waiting for replicas to be ready"
                  return hs
                end
              end
              hs.status = "Healthy"
              hs.message = "All instances are ready"
              return hs
            end
          end
          hs.status = "Progressing"
          hs.message = "Waiting for instances"
          return hs
