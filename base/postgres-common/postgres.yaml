apiVersion: postgres-operator.crunchydata.com/v1beta1
kind: PostgresCluster
metadata:
  name: postgres
  namespace: postgres
  annotations:
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
    argocd.argoproj.io/sync-wave: "1"
    postgres-operator.crunchydata.com/autoCreateUserSchema: "true"
spec:
  users:
    - name: keycloak
      databases:
        - keycloak
  instances:
    - replicas: 1
      name: "postgres"
      dataVolumeClaimSpec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 20Gi
            cpu: "200m"
            memory: "200Mi"
          limits:
            cpu: "1"
            memory: "1Gi"
      walVolumeClaimSpec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 20Gi
            cpu: "200m"
            memory: "200Mi"
          limits:
            cpu: "200m"
            memory: "200Mi"
      resources:
        requests:
          cpu: "200m"
          memory: "200Mi"
        limits:
          cpu: "1"
          memory: "1Gi"
  image: registry.developers.crunchydata.com/crunchydata/crunchy-postgres-gis:ubi8-15.1-3.3-0
  postgresVersion: 15
  postGISVersion: 3.3.0
  patroni:
    dynamicConfiguration:
      postgresql:
        pg_hba:
          - "host all all 0.0.0.0/0 md5"
          - "host all all ::/0 md5"
          - "local all all trust"
