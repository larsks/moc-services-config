---
# Source: external-secrets/templates/clustersecretstore.yaml
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    argocd.argoproj.io/sync-options: SkipDryRunOnMissingResource=true
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      # No explicit auth: credentials come from the default AWS SDK
      # credential chain, which resolves the EKS Pod Identity association
      # bound to the external-secrets controller's service account.
