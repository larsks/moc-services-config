kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080
        hostPort: 7080
        protocol: TCP
      - containerPort: 30443
        hostPort: 7443
        protocol: TCP
    # run-in-kind.sh substitutes @@REPO_PATH@@ with the absolute path to this
    # repository. The git-server deployment in overlays/kind/argocd serves it
    # to ArgoCD.
    extraMounts:
      - hostPath: "@@REPO_PATH@@"
        containerPath: /repo
        readOnly: true
