kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 80
        hostPort: 7080
        protocol: TCP
      - containerPort: 443
        hostPort: 7443
        protocol: TCP
      # lldap's web UI has no support for being served under a subpath, so it
      # gets its own port here instead of going through the path-based
      # ingress on 7080. Must match the hostPort on the lldap UI container.
      - containerPort: 17170
        hostPort: 17170
        protocol: TCP
      # Exposing 389ds
      - containerPort: 3389
        hostPort: 3389
        protocol: TCP
      - containerPort: 3636
        hostPort: 3636
        protocol: TCP
