apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: lldap-key-seed
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  refreshInterval: "0"
  target:
    name: lldap-key-seed
    creationPolicy: Owner
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: ClusterGenerator
          name: password-generator
