apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: lldap-ingress
  namespace: keycloak
  annotations:
    argocd.argoproj.io/sync-wave: "2"
    # lldap's web UI has no built-in subpath awareness, so serving it at
    # /lldap through this ingress would leave its absolute asset URLs
    # (/static/...) broken. Instead redirect to the dedicated host port
    # (see cluster.yaml) where it's served at /.
    haproxy-ingress.github.io/redirect-to: http://localhost:17170/
spec:
  ingressClassName: haproxy
  rules:
    - host: localhost
      http:
        paths:
          - path: /lldap
            pathType: Prefix
            backend:
              service:
                name: lldap
                port:
                  name: ui
