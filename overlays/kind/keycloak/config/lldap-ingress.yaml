apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: lldap-ingress
  namespace: keycloak
  annotations:
    argocd.argoproj.io/sync-wave: "2"
spec:
  defaultBackend:
    service:
      name: lldap
      port:
        name: ui
  ingressClassName: haproxy
  rules:
    - host: lldap.keycloak.local
      http:
        paths:
          - backend:
              service:
                name: lldap
                port:
                  name: ui
            pathType: ImplementationSpecific
