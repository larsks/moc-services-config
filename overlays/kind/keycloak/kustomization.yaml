apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../base/keycloak/

patches:
  - patch: |
      apiVersion: k8s.keycloak.org/v2beta1
      kind: Keycloak
      metadata:
        name: keycloak
        namespace: keycloak
      spec:
        instances: 1
        hostname:
          hostname: localhost
        ingress:
          className: haproxy
          annotations:
            # Keycloak uses a self-signed cert; skip backend TLS verification
            # as ALB does implicitly.
            haproxy-ingress.github.io/secure-backends: "true"
            # haproxy-ingress doesn't forward X-Forwarded-Host by
            # default, so Keycloak (proxy.headers: xforwarded) falls back to
            # the default port and drops :7443 from generated URLs.
            haproxy-ingress.github.io/config-backend: |
              http-request set-header X-Forwarded-Host %[req.hdr(host)]
        db:
          vendor: postgres
          host: postgres-primary.postgres.svc
          port: 5432
          schema: keycloak
          passwordSecret:
            key: password
            name: postgres-pguser-keycloak
          usernameSecret:
            key: user
            name: postgres-pguser-keycloak
