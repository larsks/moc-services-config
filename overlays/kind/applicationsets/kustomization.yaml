apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../../base/applicationsets/

patches:
  - target:
      kind: ApplicationSet
      name: root
      namespace: argocd
    patch: |
      - op: replace
        path: /spec/generators/0/git/directories/0/path
        value: overlays/kind/*
